name: Gerar APK ORUS V54.3

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Abrir pacote ORUS
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "orus-v543-*.zip" | head -n 1)
          test -n "$ZIP_FILE" || { echo "ZIP da ORUS não encontrado"; exit 1; }
          echo "Usando: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/android/settings.gradle || { echo "Projeto Android não encontrado"; exit 1; }

      - name: Compilar APK
        working-directory: extracted/android
        run: gradle :app:assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: ORUS-V54.3-APK
          path: extracted/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
